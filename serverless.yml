service: weardynamite-backend

provider:
  name: aws
  runtime: nodejs20.x
  region: ap-southeast-2
  stage: ${opt:stage, 'dev'}
  memorySize: 512
  timeout: 10

  environment:
    NODE_ENV: ${self:provider.stage}
    PORT: 3001

plugins:
  - serverless-plugin-typescript

functions:
  api:
    handler: src/handler.handler
    events:
      - httpApi:
          path: '*'
          method: '*'